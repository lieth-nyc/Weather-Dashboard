<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080010;
  --surface: #110022;
  --surface2: #1a0035;
  --border: #5500bb;
  --text: #e8f0ff;
  --text-muted: #9977cc;
  --accent: #00ffee;
  --accent-dim: #00ccdd;
  --radius: 8px;
  --shadow: 0 4px 32px rgba(0,0,0,0.8);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.app {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 24px 48px;
}

#main-content {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 20px;
  align-items: stretch;
}

header {
  margin-bottom: 28px;
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 14px;
  letter-spacing: -0.5px;
}

/* ── Tabs ─────────────────────────────────────────────────────────────────── */

.tabs-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tabs-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 1;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.tabs-bar::-webkit-scrollbar { display: none; }

.tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 8px 14px;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}

.tab:hover:not(.active) {
  background: var(--surface2);
  color: var(--text);
  transform: none;
}

.tab.active {
  background: var(--accent-dim);
  border-color: var(--accent-dim);
  color: #fff;
  transform: none;
}

.tab-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  opacity: 0.65;
  transition: opacity 0.15s, background 0.15s;
}

.tab-close:hover {
  background: rgba(255,255,255,0.2);
  opacity: 1;
}

.add-tab-btn {
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.2rem;
  font-weight: 400;
  padding: 6px 13px;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  line-height: 1.4;
}

.add-tab-btn:hover {
  background: var(--surface2);
  border-color: var(--accent);
  color: var(--accent);
  transform: none;
}

/* ── Add city panel ───────────────────────────────────────────────────────── */

.add-city-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  margin-top: 10px;
  padding: 14px;
  position: relative;
}

.add-city-search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

#add-city-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  padding: 9px 14px;
  outline: none;
  transition: border-color 0.2s;
}

#add-city-input:focus { border-color: var(--accent); }
#add-city-input::placeholder { color: var(--text-muted); }

.btn-secondary {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 9px 14px;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}

.btn-secondary:hover {
  background: var(--surface);
  color: var(--text);
  transform: none;
}

.btn-ghost {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 8px 10px;
  border-radius: 6px;
  transition: background 0.15s, color 0.15s;
}

.btn-ghost:hover {
  background: var(--surface2);
  color: var(--text);
  transform: none;
}

/* ── Suggestions ──────────────────────────────────────────────────────────── */

.suggestions {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  margin-top: 8px;
  overflow: hidden;
  z-index: 100;
}

.suggestions.hidden { display: none; }

.suggestion-item {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.suggestion-item:last-child { border-bottom: none; }

.suggestion-item:hover { background: var(--surface2); }

.suggestion-item .country {
  color: var(--text-muted);
  font-size: 0.82rem;
  margin-left: 4px;
}

/* ── Generic button base ──────────────────────────────────────────────────── */

button {
  background: var(--accent-dim);
  border: none;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 18px;
  transition: background 0.2s, transform 0.1s;
  white-space: nowrap;
}

button:hover { background: var(--accent); }
button:active { transform: scale(0.97); }

/* ── Cards ────────────────────────────────────────────────────────────────── */

.card {
  background: var(--surface);
  border: 1px solid rgba(85, 0, 187, 0.55);
  border-radius: var(--radius);
  box-shadow: 0 4px 32px rgba(0,0,0,0.8), 0 0 24px rgba(0,255,238,0.04);
  margin-bottom: 0;
  padding: 24px;
  position: relative;
}

.card h3 {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 16px;
  padding-left: 10px;
  border-left: 2px solid var(--accent-dim);
}

/* ── Current weather ─────────────────────────────────────────────────────── */

.current-weather {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.location-info h2 {
  font-size: 1.6rem;
  font-weight: 700;
}

.time {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-top: 4px;
}

.weather-main {
  display: flex;
  align-items: center;
  gap: 20px;
}

.weather-icon {
  font-size: 5rem;
  line-height: 1;
}

.temperature-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.temperature {
  font-size: 4rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;
}

.unit-toggle {
  display: flex;
  gap: 4px;
}

.unit-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 4px 10px;
}

.unit-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent-dim);
  color: #fff;
}

.unit-btn:hover:not(.active) {
  background: var(--surface);
  color: var(--text);
}

.description {
  font-size: 1.15rem;
  color: var(--text-muted);
  text-transform: capitalize;
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.detail {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.detail-label {
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}

.detail-value {
  font-size: 1.05rem;
  font-weight: 600;
}

/* ── Drag & drop ─────────────────────────────────────────────────────────── */

.drag-handle {
  position: absolute;
  top: 14px;
  right: 16px;
  color: var(--text-muted);
  opacity: 0;
  cursor: grab;
  font-size: 1.2rem;
  line-height: 1;
  transition: opacity 0.2s, background 0.15s;
  user-select: none;
  padding: 4px 6px;
  border-radius: 6px;
}

section:hover .drag-handle {
  opacity: 0.45;
}

.drag-handle:hover {
  opacity: 1 !important;
  background: var(--surface2);
}

.drag-handle:active {
  cursor: grabbing;
}

section.dragging {
  opacity: 0.45;
  outline: 2px dashed var(--accent-dim);
  outline-offset: 2px;
}

.drop-indicator {
  position: fixed;
  background: var(--accent);
  border-radius: 3px;
  pointer-events: none;
  z-index: 1000;
  box-shadow: 0 0 10px rgba(0, 255, 238, 0.7);
}

.drop-indicator.hidden { display: none !important; }

/* ── Resize handle ────────────────────────────────────────────────────────── */

.resize-handle {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 44px;
  height: 6px;
  border-radius: 3px 3px 0 0;
  background: var(--border);
  cursor: row-resize;
  opacity: 0;
  transition: opacity 0.2s, background 0.15s;
  z-index: 2;
}

section:hover .resize-handle {
  opacity: 0.45;
}

.resize-handle:hover {
  opacity: 1 !important;
  background: var(--accent-dim);
}

/* ── AQI ─────────────────────────────────────────────────────────────────── */

.aqi-row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.aqi-badge {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  background: var(--surface2);
}

.aqi-badge.good          { background: #00aa33; }
.aqi-badge.moderate      { background: #ccaa00; }
.aqi-badge.sensitive     { background: #dd5500; }
.aqi-badge.unhealthy     { background: #cc0022; }
.aqi-badge.very-unhealthy{ background: #9900cc; }
.aqi-badge.hazardous     { background: #770000; }

.aqi-info { flex: 1; }

.aqi-label {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.aqi-pollutants {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.aqi-pollutants span {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.aqi-pollutants strong {
  color: var(--text);
  margin-left: 3px;
}

/* ── Clothing ────────────────────────────────────────────────────────────── */

.clothing-summary {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 14px;
}

.clothing-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.clothing-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.88rem;
  padding: 6px 14px;
}

/* ── Chart ───────────────────────────────────────────────────────────────── */

.chart-section {
  display: flex;
  flex-direction: column;
}

.chart-section .chart-container {
  flex: 1;
  min-height: 180px;
}

.chart-container {
  position: relative;
  width: 100%;
  height: 280px;
}

/* ── Hourly ──────────────────────────────────────────────────────────────── */

.hourly-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.hourly-list::-webkit-scrollbar { height: 4px; }
.hourly-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.hourly-item {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px;
  min-width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.hourly-item.now {
  background: rgba(0, 255, 238, 0.08);
  outline: 1px solid var(--accent-dim);
}

.hourly-time {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 600;
}

.hourly-icon { font-size: 1.5rem; }

.hourly-temp {
  font-size: 0.95rem;
  font-weight: 700;
}

.hourly-precip {
  font-size: 0.7rem;
  color: #00ccdd;
}

/* ── Forecast ────────────────────────────────────────────────────────────── */

.forecast-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.forecast-item {
  display: grid;
  grid-template-columns: 90px 1.6rem 1fr auto auto auto 88px;
  align-items: center;
  gap: 0 20px;
  background: var(--surface2);
  border-radius: 10px;
  padding: 16px 20px;
}

.forecast-day {
  font-weight: 600;
  font-size: 0.92rem;
}

.forecast-icon { font-size: 1.3rem; line-height: 1; }

.forecast-desc {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.forecast-stat {
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.forecast-stat strong {
  color: var(--text);
  font-weight: 600;
}

.forecast-temps {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.temp-max {
  font-weight: 700;
  font-size: 0.92rem;
}

.temp-min {
  color: var(--text-muted);
  font-size: 0.92rem;
}

/* ── States ──────────────────────────────────────────────────────────────── */

.hidden { display: none !important; }

.loading {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 0;
  font-size: 1.05rem;
}

.error {
  background: #200015;
  border: 1px solid #cc0066;
  border-radius: var(--radius);
  color: #ff88cc;
  padding: 16px 20px;
  text-align: center;
}

/* ── Responsive ──────────────────────────────────────────────────────────── */

@media (max-width: 900px) {
  #main-content { grid-template-columns: 1fr; }
  #main-content > section { grid-column: 1 / -1 !important; min-height: unset !important; }
}

@media (max-width: 600px) {
  .details-grid { grid-template-columns: repeat(2, 1fr); }
  .forecast-item { grid-template-columns: 70px 1.4rem 1fr 76px; }
  .forecast-stat { display: none; }
  .weather-icon { font-size: 3.5rem; }
  .temperature { font-size: 3rem; }
  .add-city-search-row { flex-wrap: wrap; }
}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Weather Dashboard</h1>
      <div class="tabs-row">
        <div id="tabs-bar" class="tabs-bar"></div>
        <button id="add-tab-btn" class="add-tab-btn" title="Add city">＋</button>
      </div>
      <div id="add-city-panel" class="add-city-panel hidden">
        <div class="add-city-search-row">
          <input type="text" id="add-city-input" placeholder="Search city to add..." autocomplete="off">
          <button id="add-city-location-btn" class="btn-secondary">📍 My Location</button>
          <button id="add-city-close-btn" class="btn-ghost">✕</button>
        </div>
        <div id="add-city-suggestions" class="suggestions hidden"></div>
      </div>
    </header>

    <main id="main-content" class="hidden">
      <section id="widget-current" class="current-weather card">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <div class="location-info">
          <h2 id="city-name">—</h2>
          <p id="local-time" class="time">—</p>
        </div>
        <div class="weather-main">
          <div class="weather-icon" id="current-icon">—</div>
          <div class="temperature-block">
            <span id="current-temp" class="temperature">—</span>
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="C">°C</button>
              <button class="unit-btn" data-unit="F">°F</button>
            </div>
          </div>
        </div>
        <p id="current-description" class="description">—</p>
        <div class="details-grid">
          <div class="detail">
            <span class="detail-label">Feels Like</span>
            <span id="feels-like" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind</span>
            <span id="wind-speed" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">UV Index</span>
            <span id="uv-index" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Sunrise</span>
            <span id="sunrise" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Sunset</span>
            <span id="sunset" class="detail-value">—</span>
          </div>
        </div>
      </section>

      <section id="aqi-section" class="card hidden">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <h3>Air Quality Index</h3>
        <div class="aqi-row">
          <div id="aqi-badge" class="aqi-badge"><span id="aqi-value">—</span></div>
          <div class="aqi-info">
            <div id="aqi-label" class="aqi-label">—</div>
            <div class="aqi-pollutants">
              <span>PM2.5 <strong id="aqi-pm25">—</strong></span>
              <span>PM10 <strong id="aqi-pm10">—</strong></span>
              <span>O₃ <strong id="aqi-ozone">—</strong></span>
              <span>NO₂ <strong id="aqi-no2">—</strong></span>
            </div>
          </div>
        </div>
      </section>

      <section id="clothing-section" class="card hidden">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <h3>What to Wear</h3>
        <p id="clothing-summary" class="clothing-summary">—</p>
        <div id="clothing-items" class="clothing-items"></div>
      </section>

      <section id="widget-chart" class="chart-section card">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <h3>Temperature Trend — Today through Midnight</h3>
        <div class="chart-container">
          <canvas id="temp-chart"></canvas>
        </div>
      </section>

      <section id="widget-hourly" class="hourly-section card">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <h3>Hourly Forecast</h3>
        <div id="hourly-list" class="hourly-list"></div>
      </section>

      <section id="widget-forecast" class="forecast-section card">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <h3>7-Day Forecast</h3>
        <div id="forecast-list" class="forecast-list"></div>
      </section>
    </main>

    <div id="error-msg" class="error hidden"></div>
    <div id="loading" class="loading hidden">Loading weather data...</div>
  </div>

  <script>
const GEO_API     = 'https://geocoding-api.open-meteo.com/v1/search';
const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
const AQI_API     = 'https://air-quality-api.open-meteo.com/v1/air-quality';

const LS_TABS   = 'wdash_tabs_v1';
const LS_ACTIVE = 'wdash_active_v1';
const LS_UNIT   = 'wdash_unit_v1';
const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

const DEFAULT_TABS = [
  { id: 'default_nyc',        name: 'New York',    admin1: 'New York', country: 'United States', latitude: 40.71427, longitude: -74.00597 },
  { id: 'default_stonybrook', name: 'Stony Brook',  admin1: 'New York', country: 'United States', latitude: 40.9315,  longitude: -73.1409  },
  { id: 'default_chicago',    name: 'Chicago',      admin1: 'Illinois', country: 'United States', latitude: 41.87811, longitude: -87.62980 },
];

const WMO_CODES = {
  0:  { label: 'Clear sky',            icon: '☀️' },
  1:  { label: 'Mainly clear',         icon: '🌤️' },
  2:  { label: 'Partly cloudy',        icon: '⛅' },
  3:  { label: 'Overcast',             icon: '☁️' },
  45: { label: 'Foggy',                icon: '🌫️' },
  48: { label: 'Icy fog',              icon: '🌫️' },
  51: { label: 'Light drizzle',        icon: '🌦️' },
  53: { label: 'Moderate drizzle',     icon: '🌦️' },
  55: { label: 'Dense drizzle',        icon: '🌧️' },
  61: { label: 'Slight rain',          icon: '🌧️' },
  63: { label: 'Moderate rain',        icon: '🌧️' },
  65: { label: 'Heavy rain',           icon: '🌧️' },
  71: { label: 'Slight snow',          icon: '🌨️' },
  73: { label: 'Moderate snow',        icon: '🌨️' },
  75: { label: 'Heavy snow',           icon: '❄️' },
  77: { label: 'Snow grains',          icon: '🌨️' },
  80: { label: 'Slight showers',       icon: '🌦️' },
  81: { label: 'Moderate showers',     icon: '🌧️' },
  82: { label: 'Violent showers',      icon: '⛈️' },
  85: { label: 'Slight snow showers',  icon: '🌨️' },
  86: { label: 'Heavy snow showers',   icon: '❄️' },
  95: { label: 'Thunderstorm',         icon: '⛈️' },
  96: { label: 'Thunderstorm w/ hail', icon: '⛈️' },
  99: { label: 'Thunderstorm w/ hail', icon: '⛈️' },
};

// ── State ─────────────────────────────────────────────────────────────────────

let tabs        = [];
let activeTabId = null;
let currentUnit = 'C';
const weatherCache = {};  // { tabId: { data, timestamp } }
const aqiCache     = {};  // { tabId: { data, timestamp } }
let debounceTimer    = null;
let temperatureChart = null;
let activeTimezone   = null;
let clockInterval    = null;

// ── Helpers ───────────────────────────────────────────────────────────────────

const getWMO = code => WMO_CODES[code] || { label: 'Unknown', icon: '🌡️' };
const toF    = c    => c * 9/5 + 32;
const dispTemp = c  => currentUnit === 'C' ? `${Math.round(c)}°C` : `${Math.round(toF(c))}°F`;

function formatTime(iso, timezone, showTZ = false) {
  const opts = { hour: '2-digit', minute: '2-digit' };
  if (timezone) opts.timeZone = timezone;
  if (showTZ)   opts.timeZoneName = 'short';
  return new Date(iso).toLocaleTimeString('en-US', opts);
}

function formatDay(dateStr) {
  const d        = new Date(dateStr + 'T12:00:00');
  const today    = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);
  if (d.toDateString() === today.toDateString())    return 'Today';
  if (d.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'long' });
}

function setLocalTime(timezone) {
  const now     = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: timezone });
  const dateStr = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', timeZone: timezone });
  document.getElementById('local-time').textContent = `${dateStr} · ${timeStr}`;
}

function generateId() {
  return 'tab_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
}

// ── Persistence ───────────────────────────────────────────────────────────────

function loadState() {
  try {
    const storedTabs = localStorage.getItem(LS_TABS);
    if (storedTabs) {
      const parsed = JSON.parse(storedTabs);
      if (Array.isArray(parsed) && parsed.length > 0) {
        tabs = parsed;
        const storedActive = localStorage.getItem(LS_ACTIVE);
        activeTabId = tabs.find(t => t.id === storedActive) ? storedActive : tabs[0].id;
        currentUnit = localStorage.getItem(LS_UNIT) || 'C';
        return;
      }
    }
  } catch (_) {}
  // Defaults
  tabs        = DEFAULT_TABS.map(t => ({ ...t }));
  activeTabId = tabs[0].id;
  currentUnit = 'C';
}

function saveState() {
  localStorage.setItem(LS_TABS,   JSON.stringify(tabs));
  localStorage.setItem(LS_ACTIVE, activeTabId);
  localStorage.setItem(LS_UNIT,   currentUnit);
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function showLoading() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('main-content').classList.add('hidden');
  document.getElementById('error-msg').classList.add('hidden');
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('main-content').classList.add('hidden');
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.remove('hidden');

function showContent() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').classList.add('hidden');
  document.getElementById('main-content').classList.remove('hidden');
}

// ── Render chart ─────────────────────────────────────────────────────────────

function renderChart(hourly, timezone) {
  // Filter to today + midnight of next day in the location's local timezone
  const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: timezone });
  const tomorrowDate = new Date();
  tomorrowDate.setDate(tomorrowDate.getDate() + 1);
  const tomorrowStr = tomorrowDate.toLocaleDateString('en-CA', { timeZone: timezone });

  const labels = [], temps = [], feelsLike = [];
  for (let i = 0; i < hourly.time.length; i++) {
    const isToday    = hourly.time[i].startsWith(todayStr);
    const isMidnight = hourly.time[i] === tomorrowStr + 'T00:00';
    if (!isToday && !isMidnight) continue;
    const h = parseInt(hourly.time[i].slice(11, 13), 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const label = isMidnight ? '12 AM ↑' : `${h % 12 || 12} ${ampm}`;
    labels.push(label);
    temps.push(currentUnit === 'C' ? hourly.temperature_2m[i] : toF(hourly.temperature_2m[i]));
    feelsLike.push(currentUnit === 'C' ? hourly.apparent_temperature[i] : toF(hourly.apparent_temperature[i]));
  }

  const canvas = document.getElementById('temp-chart');
  const ctx    = canvas.getContext('2d');

  // Gradient fill for temperature line
  const gradFill = ctx.createLinearGradient(0, 0, 0, canvas.offsetHeight || 220);
  gradFill.addColorStop(0, 'rgba(0, 255, 238, 0.2)');
  gradFill.addColorStop(1, 'rgba(0, 255, 238, 0.0)');

  if (temperatureChart) {
    temperatureChart.destroy();
    temperatureChart = null;
  }

  // Current-time vertical line plugin
  const nowInTz = new Date(new Date().toLocaleString('en-US', { timeZone: timezone }));
  const nowH = nowInTz.getHours();
  const nowAmpm = nowH >= 12 ? 'PM' : 'AM';
  const nowLabel = `${nowH % 12 || 12} ${nowAmpm}`;
  const nowIndex = labels.indexOf(nowLabel);

  const currentTimePlugin = {
    id: 'currentTimeLine',
    afterDatasetsDraw(chart) {
      if (nowIndex < 0) return;
      const { ctx: c, chartArea: { top, bottom }, scales: { x } } = chart;
      const xPos = x.getPixelForValue(nowIndex);
      c.save();
      c.beginPath();
      c.setLineDash([4, 4]);
      c.strokeStyle = 'rgba(255, 255, 0, 0.8)';
      c.lineWidth = 1.5;
      c.moveTo(xPos, top);
      c.lineTo(xPos, bottom);
      c.stroke();
      // Label above
      c.setLineDash([]);
      c.fillStyle = 'rgba(255, 255, 0, 0.9)';
      const labelText = 'Now';
      const textW = c.measureText(labelText).width;
      const padding = 4;
      const boxX = xPos - textW / 2 - padding;
      const boxY = top - 1;
      const boxH = 16;
      c.fillRect(boxX, boxY, textW + padding * 2, boxH);
      c.fillStyle = '#080010';
      c.font = '600 10px system-ui, sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(labelText, xPos, boxY + boxH / 2);
      c.restore();
    },
  };

  temperatureChart = new Chart(ctx, {
    type: 'line',
    plugins: [currentTimePlugin],
    data: {
      labels,
      datasets: [
        {
          label: 'Temperature',
          data: temps,
          borderColor: '#00ffee',
          backgroundColor: gradFill,
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#00ffee',
          tension: 0.4,
          fill: true,
        },
        {
          label: 'Feels Like',
          data: feelsLike,
          borderColor: '#ff2d78',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5, 4],
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#ff2d78',
          tension: 0.4,
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: '#9977cc',
            font: { size: 12 },
            boxWidth: 14,
            padding: 16,
            usePointStyle: true,
            pointStyleWidth: 14,
          },
        },
        tooltip: {
          backgroundColor: '#110022',
          borderColor: '#5500bb',
          borderWidth: 1,
          titleColor: '#e8f0ff',
          bodyColor: '#9977cc',
          padding: 10,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${Math.round(ctx.parsed.y)}${currentUnit === 'C' ? '°C' : '°F'}`,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: '#6644aa',
            font: { size: 11 },
            maxRotation: 0,
            maxTicksLimit: 12,
          },
          grid: { color: 'rgba(85, 0, 187, 0.3)' },
          border: { color: '#5500bb' },
        },
        y: {
          ticks: {
            color: '#6644aa',
            font: { size: 11 },
            callback: v => `${Math.round(v)}${currentUnit === 'C' ? '°C' : '°F'}`,
          },
          grid: { color: 'rgba(85, 0, 187, 0.3)' },
          border: { color: '#5500bb' },
        },
      },
    },
  });
}

// ── Render weather ────────────────────────────────────────────────────────────

function renderWeather(data, tab) {
  const c      = data.current;
  const daily  = data.daily;
  const hourly = data.hourly;

  // Location header
  const nameParts = [tab.name, tab.admin1, tab.country].filter(Boolean);
  document.getElementById('city-name').textContent = nameParts.join(', ');
  activeTimezone = data.timezone;
  setLocalTime(activeTimezone);
  if (clockInterval) clearInterval(clockInterval);
  clockInterval = setInterval(() => setLocalTime(activeTimezone), 30_000);

  // Current conditions
  const wmo = getWMO(c.weather_code);
  document.getElementById('current-icon').textContent        = wmo.icon;
  document.getElementById('current-temp').textContent        = dispTemp(c.temperature_2m);
  document.getElementById('current-description').textContent = wmo.label;
  document.getElementById('feels-like').textContent          = dispTemp(c.apparent_temperature);
  document.getElementById('humidity').textContent            = `${c.relative_humidity_2m}%`;
  document.getElementById('wind-speed').textContent          = `${Math.round(c.wind_speed_10m * 0.621371)} mph`;
  document.getElementById('uv-index').textContent            = c.uv_index ?? '—';
  document.getElementById('sunrise').textContent             = daily.sunrise[0] ? formatTime(daily.sunrise[0], data.timezone, true) : '—';
  document.getElementById('sunset').textContent              = daily.sunset[0]  ? formatTime(daily.sunset[0],  data.timezone, true) : '—';

  // Sync unit buttons
  document.querySelectorAll('.unit-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.unit === currentUnit)
  );

  // Hourly (next 24 h)
  const nowMs      = Date.now();
  const hourlyList = document.getElementById('hourly-list');
  hourlyList.innerHTML = '';
  let shown = 0;
  for (let i = 0; i < hourly.time.length && shown < 24; i++) {
    const tMs = new Date(hourly.time[i]).getTime();
    if (tMs < nowMs - 3_600_000) continue;
    const isNow = shown === 0;
    const div   = document.createElement('div');
    div.className = 'hourly-item' + (isNow ? ' now' : '');
    const label  = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const precip = hourly.precipitation_probability[i];
    div.innerHTML = `
      <span class="hourly-time">${isNow ? 'Now' : label}</span>
      <span class="hourly-icon">${getWMO(hourly.weather_code[i]).icon}</span>
      <span class="hourly-temp">${dispTemp(hourly.temperature_2m[i])}</span>
      ${precip > 0 ? `<span class="hourly-precip">💧 ${precip}%</span>` : ''}
    `;
    hourlyList.appendChild(div);
    shown++;
  }

  // 7-day forecast
  const forecastList = document.getElementById('forecast-list');
  forecastList.innerHTML = '';
  for (let i = 0; i < daily.time.length; i++) {
    const wmoD   = getWMO(daily.weather_code[i]);
    const wind   = daily.wind_speed_10m_max?.[i]            != null ? `${Math.round(daily.wind_speed_10m_max[i] * 0.621371)} mph` : '—';
    const uv     = daily.uv_index_max?.[i]                  != null ? daily.uv_index_max[i].toFixed(1)                           : '—';
    const precip = daily.precipitation_probability_max?.[i] != null ? `${daily.precipitation_probability_max[i]}%`                : '—';
    const div    = document.createElement('div');
    div.className = 'forecast-item';
    div.innerHTML = `
      <span class="forecast-day">${formatDay(daily.time[i])}</span>
      <span class="forecast-icon">${wmoD.icon}</span>
      <span class="forecast-desc">${wmoD.label}</span>
      <span class="forecast-stat">💧 <strong>${precip}</strong></span>
      <span class="forecast-stat">💨 <strong>${wind}</strong></span>
      <span class="forecast-stat">UV <strong>${uv}</strong></span>
      <div class="forecast-temps">
        <span class="temp-max">${dispTemp(daily.temperature_2m_max[i])}</span>
        <span class="temp-min">${dispTemp(daily.temperature_2m_min[i])}</span>
      </div>
    `;
    forecastList.appendChild(div);
  }

  renderClothing(c.apparent_temperature, c.weather_code, c.uv_index ?? 0);
  renderChart(hourly, data.timezone);
  showContent();
}

// ── Fetch helpers ─────────────────────────────────────────────────────────────

async function doFetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude:      lat,
    longitude:     lon,
    current:       'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,uv_index',
    hourly:        'temperature_2m,apparent_temperature,weather_code,precipitation_probability',
    daily:         'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,wind_speed_10m_max,uv_index_max,precipitation_probability_max',
    timezone:      'auto',
    forecast_days: 7,
  });
  const res = await fetch(`${WEATHER_API}?${params}`);
  if (!res.ok) throw new Error('Weather data unavailable');
  return res.json();
}

async function doFetchAQI(lat, lon) {
  const params = new URLSearchParams({
    latitude:  lat,
    longitude: lon,
    current:   'us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide',
    timezone:  'auto',
  });
  const res = await fetch(`${AQI_API}?${params}`);
  if (!res.ok) throw new Error('AQI data unavailable');
  return res.json();
}

async function fetchWeatherForTab(tab) {
  const wCached = weatherCache[tab.id];
  const aCached = aqiCache[tab.id];
  const now     = Date.now();

  if (wCached && now - wCached.timestamp < CACHE_TTL) {
    renderWeather(wCached.data, tab);
    if (aCached && now - aCached.timestamp < CACHE_TTL) {
      renderAQI(aCached.data);
    } else {
      doFetchAQI(tab.latitude, tab.longitude)
        .then(d => { aqiCache[tab.id] = { data: d, timestamp: Date.now() }; renderAQI(d); })
        .catch(() => renderAQI(null));
    }
    return;
  }

  showLoading();
  try {
    const [weatherData, aqiData] = await Promise.all([
      doFetchWeather(tab.latitude, tab.longitude),
      doFetchAQI(tab.latitude, tab.longitude).catch(() => null),
    ]);
    weatherCache[tab.id] = { data: weatherData, timestamp: Date.now() };
    if (aqiData) aqiCache[tab.id] = { data: aqiData, timestamp: Date.now() };
    renderWeather(weatherData, tab);
    renderAQI(aqiData);
  } catch (e) {
    showError(`Failed to load weather: ${e.message}`);
  }
}

// ── Render AQI ────────────────────────────────────────────────────────────────

function renderAQI(data) {
  const section = document.getElementById('aqi-section');
  if (!data?.current?.us_aqi) { section.classList.add('hidden'); return; }

  const aqi = Math.round(data.current.us_aqi);
  let label, cls;
  if      (aqi <= 50)  { label = 'Good';                           cls = 'good';          }
  else if (aqi <= 100) { label = 'Moderate';                       cls = 'moderate';      }
  else if (aqi <= 150) { label = 'Unhealthy for Sensitive Groups'; cls = 'sensitive';     }
  else if (aqi <= 200) { label = 'Unhealthy';                      cls = 'unhealthy';     }
  else if (aqi <= 300) { label = 'Very Unhealthy';                 cls = 'very-unhealthy';}
  else                 { label = 'Hazardous';                      cls = 'hazardous';     }

  document.getElementById('aqi-badge').className = `aqi-badge ${cls}`;
  document.getElementById('aqi-value').textContent  = aqi;
  document.getElementById('aqi-label').textContent  = label;
  document.getElementById('aqi-pm25').textContent   = data.current.pm2_5?.toFixed(1)          ?? '—';
  document.getElementById('aqi-pm10').textContent   = data.current.pm10?.toFixed(1)           ?? '—';
  document.getElementById('aqi-ozone').textContent  = data.current.ozone?.toFixed(0)          ?? '—';
  document.getElementById('aqi-no2').textContent    = data.current.nitrogen_dioxide?.toFixed(1) ?? '—';
  section.classList.remove('hidden');
}

// ── Render clothing ───────────────────────────────────────────────────────────

function renderClothing(feelsLikeC, weatherCode, uvIndex) {
  let summary, items;

  if      (feelsLikeC < -10) { summary = 'Extreme cold'; items = ['🧥 Heavy winter coat', '🧣 Scarf', '🧤 Gloves', '🧢 Warm hat', '🥾 Insulated boots']; }
  else if (feelsLikeC <   0) { summary = 'Very cold';    items = ['🧥 Winter coat', '🧣 Scarf', '🧤 Gloves', '🧢 Hat']; }
  else if (feelsLikeC <   8) { summary = 'Cold';         items = ['🧥 Heavy jacket', '🧣 Scarf', '👖 Long pants']; }
  else if (feelsLikeC <  15) { summary = 'Cool';         items = ['🧥 Light jacket', '👕 Sweater', '👖 Long pants']; }
  else if (feelsLikeC <  20) { summary = 'Mild';         items = ['🧥 Hoodie or light jacket', '👖 Long pants']; }
  else if (feelsLikeC <  25) { summary = 'Comfortable';  items = ['👕 T-shirt', '👖 Jeans or chinos']; }
  else if (feelsLikeC <  30) { summary = 'Warm';         items = ['👕 T-shirt', '🩳 Shorts']; }
  else                        { summary = 'Hot';          items = ['👕 Light breathable clothing', '🩳 Shorts']; }

  const isRain = [51,53,55,61,63,65,80,81,82,95,96,99].includes(weatherCode);
  const isSnow = [71,73,75,77,85,86].includes(weatherCode);
  if (isRain) items.push('☂️ Umbrella');
  if (isSnow) items.push('🥾 Waterproof boots');
  if (uvIndex >= 6)      items.push('🕶️ Sunglasses', '🧴 Sunscreen SPF 50');
  else if (uvIndex >= 3) items.push('🕶️ Sunglasses');

  const feelsStr = currentUnit === 'C'
    ? `${Math.round(feelsLikeC)}°C` : `${Math.round(toF(feelsLikeC))}°F`;
  document.getElementById('clothing-summary').textContent = `${summary} — feels like ${feelsStr}`;

  const container = document.getElementById('clothing-items');
  container.innerHTML = '';
  items.forEach(item => {
    const chip = document.createElement('span');
    chip.className   = 'clothing-chip';
    chip.textContent = item;
    container.appendChild(chip);
  });

  document.getElementById('clothing-section').classList.remove('hidden');
}

// ── Tab management ────────────────────────────────────────────────────────────

function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  tabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    btn.type = 'button';

    const label = document.createElement('span');
    label.textContent = tab.name;
    btn.appendChild(label);

    if (tabs.length > 1) {
      const close = document.createElement('span');
      close.className = 'tab-close';
      close.textContent = '×';
      close.title = `Remove ${tab.name}`;
      close.addEventListener('click', e => { e.stopPropagation(); deleteTab(tab.id); });
      btn.appendChild(close);
    }

    btn.addEventListener('click', () => switchTab(tab.id));
    bar.appendChild(btn);
  });
}

function switchTab(id) {
  if (activeTabId === id) return;
  activeTabId = id;
  saveState();
  renderTabs();
  const tab = tabs.find(t => t.id === id);
  if (tab) fetchWeatherForTab(tab);
}

function addTab(locationObj) {
  // Deduplicate by rounded lat/lon
  const dup = tabs.find(t =>
    Math.abs(t.latitude  - locationObj.latitude)  < 0.01 &&
    Math.abs(t.longitude - locationObj.longitude) < 0.01
  );
  if (dup) { switchTab(dup.id); closeAddPanel(); return; }

  const tab = {
    id:        generateId(),
    name:      locationObj.name,
    admin1:    locationObj.admin1   || '',
    country:   locationObj.country  || '',
    latitude:  locationObj.latitude,
    longitude: locationObj.longitude,
  };
  tabs.push(tab);
  saveState();
  renderTabs();
  closeAddPanel();
  switchTab(tab.id);
}

function deleteTab(id) {
  if (tabs.length <= 1) return;
  const idx = tabs.findIndex(t => t.id === id);
  tabs.splice(idx, 1);
  delete weatherCache[id];
  delete aqiCache[id];
  if (activeTabId === id) {
    activeTabId = tabs[Math.min(idx, tabs.length - 1)].id;
  }
  saveState();
  renderTabs();
  const active = tabs.find(t => t.id === activeTabId);
  if (active) fetchWeatherForTab(active);
}

// ── Add city panel ────────────────────────────────────────────────────────────

function openAddPanel() {
  const panel = document.getElementById('add-city-panel');
  panel.classList.remove('hidden');
  document.getElementById('add-city-input').value = '';
  document.getElementById('add-city-suggestions').classList.add('hidden');
  document.getElementById('add-city-input').focus();
}

function closeAddPanel() {
  document.getElementById('add-city-panel').classList.add('hidden');
  document.getElementById('add-city-suggestions').classList.add('hidden');
}

async function geocode(query) {
  if (!query.trim()) return [];
  const params = new URLSearchParams({ name: query, count: 6, language: 'en', format: 'json' });
  try {
    const res  = await fetch(`${GEO_API}?${params}`);
    const data = await res.json();
    return data.results || [];
  } catch (_) { return []; }
}

function showAddSuggestions(results) {
  const sugEl = document.getElementById('add-city-suggestions');
  sugEl.innerHTML = '';
  if (!results.length) { sugEl.classList.add('hidden'); return; }
  results.forEach(r => {
    const div   = document.createElement('div');
    div.className = 'suggestion-item';
    const parts = [r.name, r.admin1, r.country].filter(Boolean);
    div.innerHTML = `${r.name}<span class="country"> — ${parts.slice(1).join(', ')}</span>`;
    div.addEventListener('click', () => addTab(r));
    sugEl.appendChild(div);
  });
  sugEl.classList.remove('hidden');
}

// ── Events ────────────────────────────────────────────────────────────────────

document.getElementById('add-tab-btn').addEventListener('click', openAddPanel);
document.getElementById('add-city-close-btn').addEventListener('click', closeAddPanel);

document.getElementById('add-city-input').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { document.getElementById('add-city-suggestions').classList.add('hidden'); return; }
  debounceTimer = setTimeout(async () => {
    const results = await geocode(q);
    showAddSuggestions(results);
  }, 300);
});

document.getElementById('add-city-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAddPanel();
});

document.getElementById('add-city-location-btn').addEventListener('click', () => {
  if (!navigator.geolocation) { showError('Geolocation not supported by your browser.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => addTab({ name: 'My Location', admin1: '', country: '', latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
    err => showError(`Location error: ${err.message}`)
  );
});

// Close panel when clicking outside it
document.addEventListener('click', e => {
  const panel  = document.getElementById('add-city-panel');
  const addBtn = document.getElementById('add-tab-btn');
  if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== addBtn) {
    closeAddPanel();
  }
});

// Unit toggle
document.querySelectorAll('.unit-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const unit = btn.dataset.unit;
    if (currentUnit === unit) return;
    currentUnit = unit;
    saveState();
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unit === unit));
    const active = tabs.find(t => t.id === activeTabId);
    if (active) {
      const cached = weatherCache[activeTabId];
      if (cached) renderWeather(cached.data, active);
      else fetchWeatherForTab(active);
    }
  });
});

// ── Widget layout (grid + drag-and-drop) ─────────────────────────────────────

const LS_WIDGETS = 'wdash_widgets_v2';

// Each row is an array of widget IDs.
// 1-item row = full width (grid-column: 1/-1).
// 2-item row = side by side (grid-column: span 1 each).
const DEFAULT_LAYOUT = [
  ['widget-current', 'widget-chart'],
  ['aqi-section', 'clothing-section'],
  ['widget-hourly'],
  ['widget-forecast'],
];
let widgetLayout = DEFAULT_LAYOUT.map(r => [...r]);

function loadLayout() {
  try {
    const saved = localStorage.getItem(LS_WIDGETS);
    if (!saved) return;
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed) || !parsed.length) return;
    // Back-compat: old format was flat array of strings
    widgetLayout = typeof parsed[0] === 'string' ? parsed.map(id => [id]) : parsed;
  } catch (_) {}
}

function saveLayout() {
  localStorage.setItem(LS_WIDGETS, JSON.stringify(widgetLayout));
}

function applyLayout() {
  const main = document.getElementById('main-content');
  const allIds = new Set(Array.from(main.querySelectorAll(':scope > section')).map(s => s.id));

  // Add any widgets missing from saved layout (new widgets added in code)
  const layoutIds = new Set(widgetLayout.flat());
  allIds.forEach(id => { if (!layoutIds.has(id)) widgetLayout.push([id]); });

  // Drop stale IDs that no longer exist in DOM
  widgetLayout = widgetLayout
    .map(row => row.filter(id => allIds.has(id)))
    .filter(row => row.length > 0);

  // Reorder DOM + set grid-column
  widgetLayout.flat().forEach(id => {
    const el = document.getElementById(id);
    if (el) main.appendChild(el);
  });
  widgetLayout.forEach(row =>
    row.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      if      (row.length === 1) el.style.gridColumn = '1 / -1'; // full width (6 cols)
      else if (row.length === 2) el.style.gridColumn = 'span 3'; // half (3 of 6)
      else                       el.style.gridColumn = 'span 2'; // third (2 of 6)
    })
  );
}

function applyDrop(dragId, type, targetId) {
  // Remove dragId from wherever it currently is
  widgetLayout = widgetLayout
    .map(row => row.filter(id => id !== dragId))
    .filter(row => row.length > 0);

  if (!targetId) { widgetLayout.push([dragId]); return; }

  const rowIdx = widgetLayout.findIndex(row => row.includes(targetId));
  if (rowIdx === -1) { widgetLayout.push([dragId]); return; }

  const row = widgetLayout[rowIdx];

  if (type === 'side-left' && row.length < 3) {
    const targetIdx = row.indexOf(targetId);
    row.splice(targetIdx, 0, dragId);
    widgetLayout[rowIdx] = row;
  } else if (type === 'side-right' && row.length < 3) {
    const targetIdx = row.indexOf(targetId);
    row.splice(targetIdx + 1, 0, dragId);
    widgetLayout[rowIdx] = row;
  } else if (type === 'before') {
    widgetLayout.splice(rowIdx, 0, [dragId]);
  } else {
    widgetLayout.splice(rowIdx + 1, 0, [dragId]);
  }
}

function initDragAndDrop() {
  const main = document.getElementById('main-content');
  let dragSrc = null;
  let lastDrop = null;

  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator hidden';
  document.body.appendChild(indicator);

  function getDropInfo(clientX, clientY) {
    const sections = Array.from(main.querySelectorAll(':scope > section')).filter(s => s !== dragSrc);
    for (const s of sections) {
      const r = s.getBoundingClientRect();
      if (clientY < r.top - 10 || clientY > r.bottom + 10) continue;
      if (clientX < r.left - 20 || clientX > r.right + 20) continue;
      const relX = (clientX - r.left) / r.width;
      const rowLen = (widgetLayout.find(row => row.includes(s.id)) || []).length;
      if (rowLen < 3 && relX < 0.28) return { type: 'side-left',  target: s, rect: r };
      if (rowLen < 3 && relX > 0.72) return { type: 'side-right', target: s, rect: r };
      const relY = (clientY - r.top) / r.height;
      return { type: relY < 0.5 ? 'before' : 'after', target: s, rect: r };
    }
    const all = Array.from(main.querySelectorAll(':scope > section'));
    const last = all[all.length - 1];
    return last ? { type: 'after', target: last, rect: last.getBoundingClientRect() } : null;
  }

  function showIndicator(info) {
    if (!info) { indicator.classList.add('hidden'); return; }
    const { type, rect: r } = info;
    const s = indicator.style;
    indicator.classList.remove('hidden');
    if (type === 'before') {
      s.left = r.left + 'px';  s.top = (r.top - 3) + 'px';
      s.width = r.width + 'px'; s.height = '3px';
    } else if (type === 'after') {
      s.left = r.left + 'px';  s.top = (r.bottom + 1) + 'px';
      s.width = r.width + 'px'; s.height = '3px';
    } else if (type === 'side-left') {
      s.left = (r.left - 3) + 'px'; s.top = r.top + 'px';
      s.width = '3px'; s.height = r.height + 'px';
    } else if (type === 'side-right') {
      s.left = (r.right + 1) + 'px'; s.top = r.top + 'px';
      s.width = '3px'; s.height = r.height + 'px';
    }
  }

  main.querySelectorAll(':scope > section').forEach(section => {
    const handle = section.querySelector('.drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', () => { section.draggable = true; });
    section.addEventListener('dragstart', e => {
      if (!section.draggable) { e.preventDefault(); return; }
      dragSrc = section;
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => section.classList.add('dragging'));
    });
    section.addEventListener('dragend', () => {
      section.classList.remove('dragging');
      section.draggable = false;
      indicator.classList.add('hidden');
      dragSrc = null; lastDrop = null;
    });
  });

  document.addEventListener('mouseup', () => {
    main.querySelectorAll(':scope > section').forEach(s => { s.draggable = false; });
  });

  main.addEventListener('dragover', e => {
    e.preventDefault();
    if (!dragSrc) return;
    lastDrop = getDropInfo(e.clientX, e.clientY);
    showIndicator(lastDrop);
  });

  main.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragSrc || !lastDrop) return;
    applyDrop(dragSrc.id, lastDrop.type, lastDrop.target?.id ?? null);
    applyLayout();
    indicator.classList.add('hidden');
    saveLayout();
  });
}

// ── Widget resize ─────────────────────────────────────────────────────────────

const LS_HEIGHTS = 'wdash_heights_v1';
let widgetHeights = {};

function loadHeights() {
  try {
    const saved = localStorage.getItem(LS_HEIGHTS);
    if (saved) widgetHeights = JSON.parse(saved);
  } catch (_) {}
}

function saveHeights() {
  localStorage.setItem(LS_HEIGHTS, JSON.stringify(widgetHeights));
}

function applyHeights() {
  Object.entries(widgetHeights).forEach(([id, h]) => {
    const el = document.getElementById(id);
    if (el) el.style.minHeight = h + 'px';
  });
}

function initResize() {
  const main = document.getElementById('main-content');
  main.querySelectorAll(':scope > section').forEach(section => {
    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    handle.title     = 'Drag to resize height · Double-click to reset';
    section.appendChild(handle);

    // Double-click resets height
    handle.addEventListener('dblclick', e => {
      e.stopPropagation();
      section.style.minHeight = '';
      delete widgetHeights[section.id];
      saveHeights();
    });

    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const startY = e.clientY;
      const startH = section.getBoundingClientRect().height;
      document.body.style.userSelect  = 'none';
      document.body.style.cursor      = 'row-resize';

      function onMove(ev) {
        const newH = Math.max(80, startH + (ev.clientY - startY));
        section.style.minHeight = newH + 'px';
      }

      function onUp(ev) {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onUp);
        document.body.style.userSelect = '';
        document.body.style.cursor     = '';
        const newH = Math.max(80, startH + (ev.clientY - startY));
        widgetHeights[section.id] = newH;
        saveHeights();
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
    });
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────

loadState();
renderTabs();
loadLayout();
loadHeights();
applyLayout();
applyHeights();
initDragAndDrop();
initResize();
const initialTab = tabs.find(t => t.id === activeTabId);
if (initialTab) fetchWeatherForTab(initialTab);
  </script>
